<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sketchpad – Draw & Sketch Online</title>
<style>
:root{--bg:#f4f2fb;--panel:#fff;--p2:#f1eefc;--line:#ddd8f0;--text:#1d1a2f;--muted:#6d6888;--acc:#7c5cff;--acc2:#6d44f0;--hero:#ece7ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0d1a;--panel:#181528;--p2:#211d38;--line:#2e2a47;--text:#f2f0fb;--muted:#9a96b5;--acc:#7c5cff;--acc2:#a78bfa;--hero:#1c1738;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f0d1a;--panel:#181528;--p2:#211d38;--line:#2e2a47;--text:#f2f0fb;--muted:#9a96b5;--acc:#7c5cff;--acc2:#a78bfa;--hero:#1c1738;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,select,.btn{font:inherit;font-size:13px;color:var(--text);background:var(--p2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;justify-content:center;white-space:nowrap}
button:hover,.btn:hover{border-color:var(--acc)}
button:disabled{opacity:.4}
.pri{background:linear-gradient(135deg,#7c5cff,#9b6bff);border-color:transparent;color:#fff;font-weight:600}
.full{width:100%}
.hd{display:flex;align-items:center;gap:10px;padding:12px 16px}
.logo{font-weight:700;font-size:20px;display:flex;gap:8px;align-items:center}
.sp{flex:1}
.nav{display:flex;gap:6px}.nav button{background:none;border-color:transparent}.nav .on{background:var(--p2);border-color:var(--acc)}
.hero{text-align:center;padding:6px 16px 14px;background:radial-gradient(ellipse at 80% 0,var(--hero),transparent 60%)}
.hero h2{font-size:30px;margin:6px 0}.hero h2 span,.land h2 span{color:var(--acc2)}.hero p,.land p{color:var(--muted);margin:4px auto 12px;max-width:520px;font-size:14px}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:12px}
.dg{display:grid;grid-template-columns:240px 1fr 230px;gap:12px;padding:0 16px;max-width:1280px;margin:12px auto}
.pn{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;align-self:start}
.tl{justify-content:flex-start;width:100%;background:none;border-color:transparent}.tl.on{background:var(--p2);border-color:var(--acc);color:var(--acc2)}
.ctr{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;min-width:0}
.ctb{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.stage{display:flex;overflow:auto;background:var(--p2);border-radius:10px;padding:10px;justify-content:flex-start}
.paper{position:relative;margin:auto;flex:none;box-shadow:0 2px 14px rgba(0,0,0,.35);background:#fff;line-height:0}
.paper canvas{position:absolute;inset:0;width:100%;height:100%}
.cap{font-size:12px;color:var(--muted);margin-bottom:4px}
.row{display:flex;gap:8px;align-items:center}.row input[type=range]{flex:1;accent-color:var(--acc)}.num{min-width:34px;text-align:center;background:var(--p2);border:1px solid var(--line);border-radius:8px;padding:4px}
.sws{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:50%;padding:0;border:2px solid var(--line)}.sw.on{border-color:var(--acc2);box-shadow:0 0 0 2px var(--acc)}
input[type=color]{width:30px;height:30px;padding:0;border:0;border-radius:50%;background:none}
.seg{display:flex;background:var(--p2);border-radius:10px;padding:3px;gap:3px}.seg button{flex:1;border:0;background:none}.seg .on{background:var(--acc);color:#fff}
.txt{width:100%;background:var(--p2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px;font:inherit;font-size:14px}
.emo{display:flex;flex-wrap:wrap;gap:2px}.emo button{font-size:20px;padding:3px 5px;border-color:transparent;background:none}.emo .on{background:var(--acc)}
.row2{display:flex;gap:8px}.row2>*{flex:1}
.ltitle{font-weight:600}.lrow{display:flex;align-items:center;gap:6px;padding:6px;border:1px solid var(--line);border-radius:10px;cursor:pointer}.lrow.on{border-color:var(--acc);background:var(--p2)}
.th{width:34px;height:34px;border-radius:6px;object-fit:cover;background:var(--p2);display:flex;align-items:center;justify-content:center;font-size:14px;flex:none}.ln{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis}
.mini{padding:3px 5px;border:0;background:none;font-size:14px}
.db{display:flex;align-items:center;gap:10px;max-width:1248px;margin:0 16px 14px;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
@media (min-width:1312px){.db{margin:0 auto 14px}}
.sec{max-width:1248px;margin:24px auto;padding:0 16px}.feats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.feat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 8px;text-align:center;font-size:13px;display:flex;flex-direction:column;gap:6px;font-size:13px}.feat b{font-size:22px}
.land{padding:6px 18px 24px;text-align:center;max-width:520px;margin:0 auto}.land h2{font-size:34px;margin:14px 0 4px}
.tile{width:150px;height:120px;margin:10px auto 16px;border-radius:22px;background:linear-gradient(135deg,#3b2a8c,#7c5cff);display:flex;align-items:center;justify-content:center;font-size:56px;box-shadow:0 10px 30px rgba(124,92,255,.35)}
.land .pri{width:100%;padding:16px;font-size:16px;margin:18px 0 10px;border-radius:14px}.land h3{text-align:left}
.me{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.mt{display:flex;align-items:center;gap:8px;padding:8px 10px}.pill{display:flex;gap:2px;background:var(--p2);border-radius:12px;padding:2px}.pill button{border:0;background:none;padding:6px 10px;font-size:16px}
.mm{flex:1;display:flex;gap:8px;padding:0 8px;min-height:0}
.rail{display:flex;flex-direction:column;gap:6px;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px;width:48px;flex:none}
.rail button{font-size:18px;padding:0;width:34px;height:36px;border-color:transparent;background:none;flex:none}.rail .on{background:var(--acc);color:#fff}
.mm .stage{flex:1;min-width:0;padding:6px}
.sheet{background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:4px 14px 12px;margin-top:8px;max-height:42dvh;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.chev{align-self:center;background:none;border:0;font-size:18px;color:var(--muted);padding:0 20px}
@media (max-width:860px){.sw{width:28px;height:28px}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const {useState,useRef,useEffect}=React,h=React.createElement;
const PAL=["#1c1c1c","#ffffff","#ef5350","#fbc02d","#43a047","#1e88e5","#8e24aa"],PAGE=["#ffffff","#fff8e1","#e3f2fd","#e8f5e9","#fce4ec","#ede7f6","#212121"];
const EMO=["😀","😍","😂","😎","🤔","😭","👍","👏","🙏","❤️","🔥","⭐","✅","❌","💡","🎉","🌈","☀️","🌸","🐶","🍕","🚀"];
const TL=[["pen","✏️","Draw"],["eraser","🧽","Eraser"],["line","╱","Line"],["arrow","➜","Arrow"],["rect","▭","Rectangle"],["circle","◯","Circle"],["emoji","😊","Emoji"],["text","T","Text"],["crop","✂️","Crop"]];
const FEATS=[["✏️","Draw Freely"],["🗂️","Multiple Layers"],["🖼️","Export PDF/PNG"]];
const mk=(w,k)=>{const c=document.createElement("canvas");c.width=w;c.height=k;return c};
let uid=1;
const cx=c=>c.getContext("2d",{willReadFrequently:true});

function App(){
  const M=useRef({w:1000,h:700,list:[],active:null,n:1,bg:"#ffffff"}).current;
  const ov=useRef(null),paper=useRef(null),stage=useRef(null),S=useRef({}),undo=useRef([]),redo=useRef([]),dl=useRef(null);
  const [tool,setTool]=useState("pen"),[color,setColor]=useState("#1c1c1c"),[size,setSize]=useState(5),[emoji,setEmoji]=useState("⭐"),[text,setText]=useState("Hello");
  const [fill,setFill]=useState(false),[zoom,setZoom]=useState(100),[fmt,setFmt]=useState("pdf"),[msg,setMsg]=useState("Ready. Pick a tool and start drawing."),[,setV]=useState(0);
  const [started,setStarted]=useState(false),[open,setOpen]=useState(true),[panel,setPanel]=useState("tool"),[theme,setTheme]=useState(null);
  const [mob,setMob]=useState(()=>matchMedia("(max-width:860px)").matches);
  const re=()=>setV(v=>v+1);

  const newLayer=(name,type)=>({id:uid++,name,type,vis:true,lock:false,cvs:mk(M.w,M.h)});
  if(!ov.current)ov.current=mk(M.w,M.h);
  if(!M.list.length){const b=newLayer("Background","bg");cx(b.cvs).fillStyle=M.bg;cx(b.cvs).fillRect(0,0,M.w,M.h);const l=newLayer("Layer 1","draw");M.list=[b,l];M.active=l.id}
  const sizeOv=()=>{ov.current.width=M.w;ov.current.height=M.h};
  const act=()=>M.list.find(l=>l.id===M.active);
  const takeFull=()=>({w:M.w,h:M.h,bg:M.bg,active:M.active,layers:M.list.map(l=>({id:l.id,name:l.name,type:l.type,vis:l.vis,lock:l.lock,thumb:l.thumb,img:cx(l.cvs).getImageData(0,0,M.w,M.h)}))});
  const restoreFull=s=>{M.w=s.w;M.h=s.h;M.bg=s.bg;M.active=s.active;M.list=s.layers.map(m=>{const c=mk(s.w,s.h);cx(c).putImageData(m.img,0,0);return{id:m.id,name:m.name,type:m.type,vis:m.vis,lock:m.lock,thumb:m.thumb,cvs:c}});sizeOv()};
  const push=e=>{undo.current.push(e);if(undo.current.length>15)undo.current.shift();redo.current=[];re()};
  const pushFull=()=>push({k:"full",s:takeFull()});
  const pushOne=L=>push({k:"one",id:L.id,img:cx(L.cvs).getImageData(0,0,M.w,M.h)});
  const swap=(e,to)=>{
    if(e.k==="one"){const L=M.list.find(l=>l.id===e.id);if(!L)return;to.push({k:"one",id:e.id,img:cx(L.cvs).getImageData(0,0,M.w,M.h)});cx(L.cvs).putImageData(e.img,0,0)}
    else{to.push({k:"full",s:takeFull()});restoreFull(e.s)}
  };
  const doUndo=()=>{const e=undo.current.pop();if(e){swap(e,redo.current);re()}};
  const doRedo=()=>{const e=redo.current.pop();if(e){swap(e,undo.current);re()}};

  useEffect(()=>{
    const m=matchMedia("(max-width:860px)"),f=()=>setMob(m.matches);m.addEventListener("change",f);
    try{window.claude&&claude.use("downloads").then(d=>{dl.current=d}).catch(()=>{})}catch(e){}
    return()=>m.removeEventListener("change",f);
  },[]);

  const pos=e=>{const r=ov.current.getBoundingClientRect();return{x:(e.clientX-r.left)*M.w/r.width,y:(e.clientY-r.top)*M.h/r.height}};
  const brushSet=c=>{const er=tool==="eraser";c.globalCompositeOperation=er?"destination-out":"source-over";c.strokeStyle=c.fillStyle=color;c.lineWidth=er?size*2.5:tool==="brush"?size*1.8:size;c.lineCap=c.lineJoin="round";c.shadowBlur=tool==="brush"?size:0;c.shadowColor=color};
  const brushOff=c=>{c.globalCompositeOperation="source-over";c.shadowBlur=0};
  const shape=(c,a,b)=>{
    c.strokeStyle=c.fillStyle=color;c.lineWidth=size;c.lineCap=c.lineJoin="round";
    if(tool==="line"||tool==="arrow"){
      c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.stroke();
      if(tool==="arrow"){const g=Math.atan2(b.y-a.y,b.x-a.x),L=12+size*3;c.beginPath();c.moveTo(b.x,b.y);c.lineTo(b.x-L*Math.cos(g-.45),b.y-L*Math.sin(g-.45));c.lineTo(b.x-L*Math.cos(g+.45),b.y-L*Math.sin(g+.45));c.closePath();c.fill()}
    }else if(tool==="rect"){c.beginPath();c.rect(a.x,a.y,b.x-a.x,b.y-a.y);fill?c.fill():c.stroke()}
    else if(tool==="circle"){c.beginPath();c.ellipse((a.x+b.x)/2,(a.y+b.y)/2,Math.abs(b.x-a.x)/2,Math.abs(b.y-a.y)/2,0,0,7);fill?c.fill():c.stroke()}
    else if(tool==="crop"){c.save();c.setLineDash([10,7]);c.strokeStyle="#7c5cff";c.lineWidth=4;c.strokeRect(a.x,a.y,b.x-a.x,b.y-a.y);c.restore()}
  };
  const cropAll=(x,y,w,k)=>{M.list.forEach(l=>{const t=mk(M.w,M.h);cx(t).drawImage(l.cvs,0,0);l.cvs.width=w;l.cvs.height=k;cx(l.cvs).drawImage(t,-x,-y)});M.w=w;M.h=k;sizeOv()};

  const down=e=>{
    const p=pos(e);
    if(tool==="crop"){e.preventDefault();ov.current.setPointerCapture(e.pointerId);S.current={on:true,s:p};return}
    const L=act();
    if(!L||L.type==="bg"||L.lock||!L.vis){setMsg("Select an unlocked, visible drawing layer first.");return}
    e.preventDefault();ov.current.setPointerCapture(e.pointerId);
    const c=cx(L.cvs);S.current={on:true,L,s:p,l:p};pushOne(L);
    if(tool==="emoji"){c.font=(28+size*6)+"px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif";c.textAlign="center";c.textBaseline="middle";c.fillText(emoji,p.x,p.y);S.current.on=false}
    else if(tool==="text"){c.font="600 "+(14+size*4)+"px system-ui,sans-serif";c.textAlign="left";c.textBaseline="middle";c.fillStyle=color;c.fillText(text,p.x,p.y);S.current.on=false}
    else if(tool==="pen"||tool==="brush"||tool==="eraser"){brushSet(c);c.beginPath();c.arc(p.x,p.y,c.lineWidth/2,0,7);c.fill();brushOff(c)}
  };
  const move=e=>{
    const s=S.current;if(!s.on)return;const p=pos(e);
    if(["pen","brush","eraser"].includes(tool)){const c=cx(s.L.cvs);brushSet(c);c.beginPath();c.moveTo(s.l.x,s.l.y);c.lineTo(p.x,p.y);c.stroke();brushOff(c);s.l=p}
    else{const o=cx(ov.current);o.clearRect(0,0,M.w,M.h);shape(o,s.s,p)}
  };
  const up=e=>{
    const s=S.current;if(!s.on)return;s.on=false;const p=pos(e);cx(ov.current).clearRect(0,0,M.w,M.h);
    if(tool==="crop"){
      const x=Math.max(0,Math.round(Math.min(s.s.x,p.x))),y=Math.max(0,Math.round(Math.min(s.s.y,p.y)));
      const w=Math.min(M.w-x,Math.round(Math.abs(p.x-s.s.x))),k=Math.min(M.h-y,Math.round(Math.abs(p.y-s.s.y)));
      if(w>10&&k>10){pushFull();cropAll(x,y,w,k);setMsg("Cropped to "+w+" × "+k+". Undo restores the full page.")}else setMsg("Drag a larger area to crop.");
    }else if(["line","arrow","rect","circle"].includes(tool))shape(cx(s.L.cvs),s.s,p);
    re();
  };
  useEffect(()=>{
    const o=ov.current;if(paper.current)paper.current.replaceChildren(...M.list.filter(l=>l.vis).map(l=>l.cvs),o);
    o.style.touchAction="none";o.style.cursor=tool==="eraser"?"cell":"crosshair";
    o.onpointerdown=down;o.onpointermove=move;o.onpointerup=up;o.onpointercancel=up;
  });

  const addLayer=()=>{pushFull();const l=newLayer("Layer "+(++M.n),"draw");let i=M.list.findIndex(x=>x.id===M.active);if(i<0)i=M.list.length-1;M.list.splice(i+1,0,l);M.active=l.id;re()};
  const delLayer=l=>{pushFull();M.list=M.list.filter(x=>x!==l);if(M.active===l.id){const d=[...M.list].reverse().find(x=>x.type!=="bg");M.active=d?d.id:M.list[0].id}re()};
  const pageColor=col=>{
    if(!M.pc)pushFull();clearTimeout(M.pc);M.pc=setTimeout(()=>{M.pc=0},800);
    M.bg=col;const b=M.list.find(l=>l.type==="bg");if(b){const c=cx(b.cvs);c.fillStyle=col;c.fillRect(0,0,M.w,M.h)}re();
  };
  const importPhoto=e=>{
    const f=e.target.files&&e.target.files[0];e.target.value="";if(!f)return;
    const fr=new FileReader();
    fr.onload=()=>{const img=new Image();
      img.onload=()=>{
        const sc=Math.min(1000/img.width,1400/img.height,1.5),w=Math.round(img.width*sc),k=Math.round(img.height*sc);
        pushFull();
        M.list.forEach(l=>{const t=mk(M.w,M.h);cx(t).drawImage(l.cvs,0,0);l.cvs.width=w;l.cvs.height=k;cx(l.cvs).drawImage(t,0,0);if(l.type==="bg"){cx(l.cvs).fillStyle=M.bg;cx(l.cvs).fillRect(0,0,w,k)}});
        M.w=w;M.h=k;sizeOv();
        const L=newLayer("Image","image");cx(L.cvs).drawImage(img,0,0,w,k);
        const th=mk(68,68),tc=cx(th),q=Math.max(68/w,68/k);tc.drawImage(L.cvs,(68-w*q)/2,(68-k*q)/2,w*q,k*q);L.thumb=th.toDataURL("image/jpeg",.7);
        M.list.splice(1,0,L);setMsg("Photo added as a layer. Draw on top of it.");re();
      };
      img.onerror=()=>setMsg("Couldn’t read that image.");img.src=fr.result};
    fr.readAsDataURL(f);
  };
  const clearAll=()=>{const L=act();if(!L||L.type==="bg"){setMsg("Select a drawing layer to erase.");return}pushOne(L);cx(L.cvs).clearRect(0,0,M.w,M.h);re();setMsg("Layer cleared. Undo if needed.")};

  const flat=()=>{const t=mk(M.w,M.h),c=cx(t);c.fillStyle="#fff";c.fillRect(0,0,M.w,M.h);M.list.filter(l=>l.vis).forEach(l=>c.drawImage(l.cvs,0,0));return t};
  const save=async f=>{
    const t=flat(),w=t.width,k=t.height,photo=M.list.some(l=>l.type==="image");let blob,name;
    try{
      if(f==="pdf"){
        const pdf=new window.jspdf.jsPDF({orientation:w>=k?"l":"p",unit:"px",format:[w,k],hotfixes:["px_scaling"]});
        pdf.addImage(photo?t.toDataURL("image/jpeg",.92):t.toDataURL("image/png"),photo?"JPEG":"PNG",0,0,w,k);
        if(!dl.current){pdf.save("drawing.pdf");setMsg("Saved drawing.pdf");return}
        blob=pdf.output("blob");name="drawing.pdf";
      }else{
        blob=await new Promise(r=>t.toBlob(r,"image/png"));name="drawing.png";
        if(!dl.current){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();return}
      }
      await dl.current.save({filename:name,data:blob});setMsg("Saved "+name);
    }catch(err){setMsg(err&&err.code==="declined"?"Save cancelled.":"Couldn’t save the file here.")}
  };
  const toggleTheme=()=>{const cur=theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"),n=cur==="dark"?"light":"dark";setTheme(n);document.documentElement.dataset.theme=n};
  const pick=id=>{setTool(id);setPanel("tool");setMsg(id==="crop"?"Drag a box over the part to keep.":id==="emoji"?"Choose an emoji, then tap the page.":id==="text"?"Type your text, then tap the page.":"")};

  const sw=(c,on,fn)=>h("button",{key:c,className:"sw"+(on?" on":""),style:{background:c},"aria-label":c,onClick:fn});
  const isOn=id=>tool===id||(id==="pen"&&tool==="brush");
  const fmtSel=h("select",{value:fmt,onChange:e=>setFmt(e.target.value)},h("option",{value:"pdf"},"PDF"),h("option",{value:"png"},"PNG"));
  const undoBtns=[h("button",{key:"u",onClick:doUndo,disabled:!undo.current.length},"↶ Undo"),h("button",{key:"r",onClick:doRedo,disabled:!redo.current.length},"↷ Redo")];
  const themeBtn=h("button",{onClick:toggleTheme,"aria-label":"Toggle theme"},"☀️");
  const logo=h("div",{className:"logo"},"🎨 Sketchpad");
  const feats=h("div",{className:"feats"},FEATS.map(([i,l])=>h("div",{className:"feat",key:l},h("b",null,i),l)));
